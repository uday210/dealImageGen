<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#60AEFF"/>
      <stop offset="100%" stop-color="#1D6FE8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E38"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="42" fill="url(#bg)"/>
  <!-- D - white bold -->
  <text x="18" y="148" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="128" font-weight="900" fill="white" letter-spacing="-4">D</text>
  <!-- S - blue gradient, overlapping -->
  <text x="94" y="148" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="128" font-weight="900" fill="url(#sg)" letter-spacing="-4">S</text>
</svg>
